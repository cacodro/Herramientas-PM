<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Ventas — Locales Plaza Música</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f7f5f1;
    --panel:#ffffff;
    --line:#e4e0d8;
    --gold:#b8863b;
    --gold-dark:#8f6427;
    --green:#3f7d5c;
    --red:#b0473e;
    --muted:#8a8478;
    --sidebar:#20201d;
    --sidebar-ink:#cfc9bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--sidebar);
    color:var(--sidebar-ink);
    padding:28px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 22px 22px 22px;
    border-bottom:1px solid #33322d;
    margin-bottom:10px;
  }
  .brand .disc{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold) 0%, var(--gold-dark) 55%, #1a1a1a 56%, #1a1a1a 100%);
    margin-bottom:10px;
  }
  .brand h1{
    font-size:15px;
    margin:0;
    font-weight:600;
    color:#fff;
    letter-spacing:.2px;
  }
  .brand p{margin:4px 0 0;font-size:11.5px;color:#8f8a7d;}
  nav{flex:1;padding-top:6px;}
  nav button{
    display:block;width:100%;text-align:left;
    background:none;border:none;
    color:var(--sidebar-ink);
    padding:11px 22px;
    font-size:13.5px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  nav button:hover{background:#2a2a25;}
  nav button.active{
    background:#2a2a25;
    color:#fff;
    border-left:3px solid var(--gold);
    font-weight:600;
  }
  .sidebar-foot{
    padding:14px 22px 0;
    font-size:10.5px;
    color:#6b665c;
    border-top:1px solid #33322d;
  }

  /* MAIN */
  .main{flex:1;padding:26px 34px 60px;max-width:1180px;}
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:14px;
    margin-bottom:22px;
  }
  .topbar h2{margin:0 0 4px;font-size:22px;font-weight:600;}
  .topbar .sub{font-size:13px;color:var(--muted);}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .controls label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;}
  .controls select, .controls button.refresh{
    font-family:inherit;font-size:13px;
    padding:7px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--ink);
  }
  .controls button.refresh{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink);}

  .state{
    padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;
  }
  .state.error{color:var(--red);}
  .state code{background:#f0ede6;padding:2px 6px;border-radius:4px;}

  /* KPI cards */
  .kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;min-width:160px;flex:1;
  }
  .kpi .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .kpi .value{font-size:21px;font-weight:700;}
  .kpi .delta{font-size:12px;margin-top:5px;font-weight:600;}
  .up{color:var(--green);}
  .down{color:var(--red);}
  .flat{color:var(--muted);}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:20px 22px;margin-bottom:20px;
  }
  .panel h3{margin:0 0 14px;font-size:14.5px;font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:none;}
  tr.total-row td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .tag.up{background:#e6f0ea;color:var(--green);}
  .tag.down{background:#f6e9e7;color:var(--red);}
  .tag.flat{background:#efece5;color:var(--muted);}

  .insights{padding-left:18px;margin:0;font-size:13.5px;line-height:1.7;}
  .insights li{margin-bottom:4px;}

  .chart-wrap{position:relative;height:280px;}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand{display:none;}
    nav{display:flex;padding:0;}
    nav button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:8px 14px;}
    nav button.active{border-left:none;border-bottom:3px solid var(--gold);}
    .main{padding:18px;}
    table{font-size:12px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="disc"></div>
      <h1>Ventas Locales</h1>
      <p>Plaza Música · Chile</p>
    </div>
    <nav id="nav">
      <button data-tab="resumen" class="active">Resumen Ejecutivo</button>
      <button data-tab="local">Ventas por Local</button>
      <button data-tab="finde">Semana vs Fin de Semana</button>
      <button data-tab="ticket">Ticket Promedio</button>
      <button data-tab="dia">Ventas por Día</button>
      <button data-tab="devoluciones">Devoluciones</button>
      <button data-tab="ranking">Ranking Mensual</button>
      <button data-tab="acumulado">Acumulado</button>
    </nav>
    <div class="sidebar-foot" id="lastUpdate">Cargando datos…</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Resumen Ejecutivo</h2>
        <div class="sub" id="pageSub">Período completo disponible</div>
      </div>
      <div class="controls">
        <div>
          <label>Desde</label>
          <select id="fromMonth"></select>
        </div>
        <div>
          <label>Hasta</label>
          <select id="toMonth"></select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="refresh" id="refreshBtn">Actualizar datos</button>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="refresh" id="exportBtn" style="background:#3f7d5c;border-color:#3f7d5c;">Descargar Excel</button>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="state" id="loadingState">Cargando ventas desde Google Sheets…</div>
    </div>
  </main>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — reemplazar si cambia la hoja de origen
   ========================================================= */
const SHEET_ID = "1-oCZq71RxeXUc3fjWH1op64XK62wUThBWm95RVEsAbU";
const SHEET_NAME = "datos_web"; // pestaña liviana (6 columnas) generada desde el CSV depurado
// Si se publicó la hoja como CSV (File > Share > Publish to the web), esa URL es más confiable
// para hojas grandes que el endpoint gviz. Reemplazar cuando esté disponible.
const SHEET_GID = "2099626484"; // gid de la pestaña "datos_web" (más confiable que el nombre)

const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmtCLP = n => (n<0?'-':'') + '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
const fmtPct = n => (n*100).toFixed(1) + '%';

let RECORDS = [];
let charts = {};

/* =========================================================
   CARGA Y PARSEO
   ========================================================= */
function parseCLNumber(str){
  if (str === undefined || str === null || str === '') return 0;
  const cleaned = String(str).replace(/[^\d-]/g,'');
  const n = parseInt(cleaned,10);
  return isNaN(n) ? 0 : n;
}

function parseFechaHora(str){
  // formato esperado: dd/mm/yyyy hh:mm:ss  (o solo dd/mm/yyyy)
  if(!str) return null;
  const [datePart] = String(str).trim().split(' ');
  const parts = datePart.split('/');
  if(parts.length !== 3) return null;
  const [dd,mm,yyyy] = parts.map(p=>parseInt(p,10));
  if(!dd||!mm||!yyyy) return null;
  return new Date(yyyy, mm-1, dd);
}

function esDevolucionRow(tipoMov, bruto){
  const mov = (tipoMov||'').toLowerCase();
  return mov.includes('devoluc') || bruto < 0;
}

async function fetchGvizRows(){
  return new Promise((resolve, reject)=>{
    const cbName = 'gvizCB_' + Date.now();
    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error('TIMEOUT'));
    }, 20000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(response){
      cleanup();
      if(!response || response.status === 'error'){
        reject(new Error('NOT_PUBLIC'));
        return;
      }
      if(!response.table){ reject(new Error('EMPTY')); return; }
      const cols = response.table.cols.map(c => c.label || c.id || '');
      const rows = response.table.rows.map(r=>{
        const obj = {};
        (r.c||[]).forEach((cell,i)=>{
          obj[cols[i]] = cell ? (cell.v !== undefined && cell.v !== null ? cell.v : (cell.f || '')) : '';
        });
        return obj;
      });
      resolve(rows);
    };

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
      + `?headers=1&gid=${SHEET_GID}`
      + `&tqx=out:json;responseHandler:${cbName}`
      + `&_=${Date.now()}`;

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { cleanup(); reject(new Error('NOT_PUBLIC')); };
    document.body.appendChild(script);
  });
}

async function loadData(){
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="state" id="loadingState">Cargando ventas desde Google Sheets…</div>';
  try{
    const rows = await fetchGvizRows();
    if(!rows.length) throw new Error('EMPTY');

    RECORDS = rows.map(row => {
      const fecha = parseFechaHora(row['Fecha']);
      if(!fecha) return null;
      const bruto = parseCLNumber(row['Venta Total Bruta']);
      const neto  = parseCLNumber(row['Venta Total Neta']);
      const tipoMov = row['Tipo Movimiento'] || '';
      const devol = esDevolucionRow(tipoMov, bruto);
      const dow = fecha.getDay();
      return {
        fecha,
        monthKey: fecha.getFullYear() + '-' + String(fecha.getMonth()+1).padStart(2,'0'),
        monthLabel: MONTH_NAMES[fecha.getMonth()] + ' ' + fecha.getFullYear(),
        weekday: WEEKDAYS[dow],
        tipoDia: (dow===0||dow===6) ? 'Fin de Semana' : 'Semana',
        local: (row['Sucursal']||'Sin sucursal').trim(),
        bruto, neto,
        devolucion: devol,
        comprobante: (row['Numero del documento']||'') + '|' + tipoMov
      };
    }).filter(Boolean);

    if(!RECORDS.length) throw new Error('EMPTY');

    document.getElementById('lastUpdate').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-CL') + ' · ' + RECORDS.length.toLocaleString('es-CL') + ' líneas';

    populateMonthSelectors();
    renderActiveTab();
  }catch(err){
    let msg = 'No se pudo cargar la planilla.';
    let hint = 'Revisa que la hoja esté compartida como "Cualquier persona con el enlace" y que el nombre de la pestaña (SHEET_NAME) sea correcto.';
    if(err.message === 'NOT_PUBLIC'){
      msg = 'La hoja de Google todavía no está pública, o el nombre de la pestaña no coincide.';
      hint = 'En Drive: clic derecho sobre la hoja → Compartir → "Cualquier persona con el enlace" → rol Lector. Y confirma que la pestaña se llame exactamente "' + SHEET_NAME + '".';
    } else if(err.message === 'EMPTY'){
      msg = 'La hoja se pudo leer pero no trae filas de ventas.';
      hint = 'Verifica que la pestaña "' + SHEET_NAME + '" sea la que contiene el detalle de Bsale.';
    } else if(err.message === 'TIMEOUT'){
      msg = 'La hoja demoró demasiado en responder.';
      hint = 'Puede ser una conexión lenta o un archivo muy grande. Prueba actualizar de nuevo.';
    }
    const attemptedUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&gid=${SHEET_GID}&tqx=out:json`;
    contentEl.innerHTML = `<div class="state error"><strong>${msg}</strong><br><br>${hint}<br><br>
      <span style="font-size:11px;color:#8a8478">Error técnico: ${(err && err.message) || err} (${(err && err.name) || ''})</span><br><br>
      <code>${attemptedUrl}</code></div>`;
    document.getElementById('lastUpdate').textContent = 'Sin datos cargados';
  }
}

/* =========================================================
   SELECTORES DE PERÍODO
   ========================================================= */
function populateMonthSelectors(){
  const months = [...new Set(RECORDS.map(r=>r.monthKey))].sort();
  const fromSel = document.getElementById('fromMonth');
  const toSel = document.getElementById('toMonth');
  fromSel.innerHTML = ''; toSel.innerHTML = '';
  months.forEach(mk=>{
    const label = RECORDS.find(r=>r.monthKey===mk).monthLabel;
    fromSel.innerHTML += `<option value="${mk}">${label}</option>`;
    toSel.innerHTML += `<option value="${mk}">${label}</option>`;
  });
  fromSel.value = months[0];
  toSel.value = months[months.length-1];
}

function getSelectedRecords(){
  const from = document.getElementById('fromMonth').value;
  const to = document.getElementById('toMonth').value;
  return RECORDS.filter(r => r.monthKey >= from && r.monthKey <= to);
}

function getSelectedMonths(){
  const from = document.getElementById('fromMonth').value;
  const to = document.getElementById('toMonth').value;
  return [...new Set(RECORDS.filter(r=>r.monthKey>=from && r.monthKey<=to).map(r=>r.monthKey))].sort();
}

/* =========================================================
   NAVEGACIÓN DE PESTAÑAS
   ========================================================= */
const TAB_TITLES = {
  resumen: ['Resumen Ejecutivo','Vista general del período seleccionado'],
  local: ['Ventas por Local','Comparación mensual local a local'],
  finde: ['Semana vs Fin de Semana','Distribución de ventas por tipo de día'],
  ticket: ['Ticket Promedio','Monto promedio por comprobante'],
  dia: ['Ventas por Día','Todos los locales, agregado por día de la semana'],
  devoluciones: ['Devoluciones','Notas de crédito y anulaciones por local'],
  ranking: ['Ranking Mensual','Evolución del orden de locales mes a mes'],
  acumulado: ['Acumulado','Ventas corridas (YTD) totales y por local']
};
let activeTab = 'resumen';

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderActiveTab();
});
document.getElementById('fromMonth').addEventListener('change', renderActiveTab);
document.getElementById('toMonth').addEventListener('change', renderActiveTab);
document.getElementById('refreshBtn').addEventListener('click', loadData);

function renderActiveTab(){
  if(!RECORDS.length) return;
  const [title,sub] = TAB_TITLES[activeTab];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  const renderers = {
    resumen: renderResumen, local: renderLocal, finde: renderFinde,
    ticket: renderTicket, dia: renderDia, devoluciones: renderDevoluciones, ranking: renderRanking,
    acumulado: renderAcumulado
  };
  renderers[activeTab]();
}

/* =========================================================
   AGREGACIONES BASE
   ========================================================= */
function sum(arr, fn){ return arr.reduce((a,r)=>a+fn(r),0); }

function totalsByLocalMonth(records){
  const map = {};
  records.forEach(r=>{
    map[r.local] = map[r.local] || {};
    map[r.local][r.monthKey] = (map[r.local][r.monthKey]||0) + r.bruto;
  });
  return map;
}

function trendTag(pct){
  if(pct === null) return {cls:'flat', label:'s/d'};
  if(pct > 0.03) return {cls:'up', label:'▲ Creciendo'};
  if(pct < -0.03) return {cls:'down', label:'▼ Cayendo'};
  return {cls:'flat', label:'► Estable'};
}

/* =========================================================
   TAB: RESUMEN EJECUTIVO
   ========================================================= */
function renderResumen(){
  const recs = getSelectedRecords();
  const months = getSelectedMonths();
  const totalPeriodo = sum(recs, r=>r.bruto);

  const monthTotals = months.map(mk => ({
    mk, label: recs.find(r=>r.monthKey===mk).monthLabel,
    total: sum(recs.filter(r=>r.monthKey===mk), r=>r.bruto)
  }));

  const last = monthTotals[monthTotals.length-1];
  const prev = monthTotals[monthTotals.length-2];
  const momPct = prev ? (last.total - prev.total)/prev.total : null;
  const momTag = trendTag(momPct);

  const byLocal = {};
  recs.forEach(r=> byLocal[r.local] = (byLocal[r.local]||0) + r.bruto);
  const ranking = Object.entries(byLocal).sort((a,b)=>b[1]-a[1]);
  const topLocal = ranking[0];
  const bottomLocal = ranking[ranking.length-1];

  let html = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="label">Ventas totales del período</div>
        <div class="value">${fmtCLP(totalPeriodo)}</div>
      </div>
      <div class="kpi">
        <div class="label">Meses incluidos</div>
        <div class="value">${months.length}</div>
      </div>
      <div class="kpi">
        <div class="label">${last ? last.label : '—'} vs mes anterior</div>
        <div class="value">${last ? fmtCLP(last.total) : '—'}</div>
        ${prev ? `<div class="delta ${momTag.cls}">${momPct>=0?'▲':'▼'} ${fmtPct(Math.abs(momPct))}</div>` : ''}
      </div>
      <div class="kpi">
        <div class="label">Local líder del período</div>
        <div class="value" style="font-size:16px">${topLocal ? topLocal[0] : '—'}</div>
        <div class="delta flat">${topLocal ? fmtCLP(topLocal[1]) : ''}</div>
      </div>
    </div>

    <div class="panel">
      <h3>Evolución mensual de ventas</h3>
      <div class="chart-wrap"><canvas id="chartMensual"></canvas></div>
    </div>

    <div class="panel">
      <h3>Ranking de locales — total del período</h3>
      <table>
        <thead><tr><th>#</th><th>Local</th><th>Total período</th><th>% Particip.</th></tr></thead>
        <tbody>
          ${ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${fmtCLP(r[1])}</td><td>${fmtPct(r[1]/totalPeriodo)}</td></tr>`).join('')}
          <tr class="total-row"><td></td><td>TOTAL GENERAL</td><td>${fmtCLP(totalPeriodo)}</td><td>100.0%</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Lectura rápida para el negocio</h3>
      <ul class="insights">
        ${prev ? `<li>Las ventas de ${last.label} ${momPct>=0?'crecieron':'cayeron'} un ${fmtPct(Math.abs(momPct))} frente a ${prev.label}.</li>` : ''}
        <li>${topLocal ? `${topLocal[0]} es el local líder del período, con ${fmtPct(topLocal[1]/totalPeriodo)} de participación.` : ''}</li>
        <li>${bottomLocal && bottomLocal[0]!==topLocal[0] ? `${bottomLocal[0]} es el local con menor venta acumulada en el rango seleccionado.` : ''}</li>
      </ul>
    </div>
  `;
  document.getElementById('content').innerHTML = html;

  if(charts.mensual) charts.mensual.destroy();
  charts.mensual = new Chart(document.getElementById('chartMensual'), {
    type:'line',
    data:{
      labels: monthTotals.map(m=>m.label),
      datasets:[{
        label:'Ventas brutas',
        data: monthTotals.map(m=>m.total),
        borderColor:'#b8863b', backgroundColor:'rgba(184,134,59,.15)',
        fill:true, tension:.25, pointRadius:4
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{ticks:{callback:v=>'$'+(v/1e6).toFixed(0)+'M'}}}
    }
  });
}

/* =========================================================
   TAB: VENTAS POR LOCAL
   ========================================================= */
function renderLocal(){
  const recs = getSelectedRecords();
  const months = getSelectedMonths();
  const byLocalMonth = totalsByLocalMonth(recs);
  const locals = Object.keys(byLocalMonth);

  const rows = locals.map(local=>{
    const perMonth = months.map(mk => byLocalMonth[local][mk] || 0);
    const total = sum(perMonth, x=>x);
    const last = perMonth[perMonth.length-1];
    const prev = perMonth[perMonth.length-2];
    const varPct = (prev !== undefined && prev !== 0) ? (last-prev)/prev : null;
    return {local, perMonth, total, varPct};
  }).sort((a,b)=>b.total-a.total);

  const grandTotal = sum(rows, r=>r.total);

  let html = `
    <div class="panel">
      <h3>Ventas por local (${months.length} mes${months.length>1?'es':''})</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Local</th>
          ${months.map(mk=>`<th>${recs.find(r=>r.monthKey===mk).monthLabel}</th>`).join('')}
          <th>Total</th><th>% Particip.</th><th>Var. últ. mes</th><th>Tendencia</th>
        </tr></thead>
        <tbody>
        ${rows.map(r=>{
          const tag = trendTag(r.varPct);
          return `<tr>
            <td>${r.local}</td>
            ${r.perMonth.map(v=>`<td>${fmtCLP(v)}</td>`).join('')}
            <td><strong>${fmtCLP(r.total)}</strong></td>
            <td>${fmtPct(r.total/grandTotal)}</td>
            <td>${r.varPct===null?'s/d':fmtPct(r.varPct)}</td>
            <td><span class="tag ${tag.cls}">${tag.label}</span></td>
          </tr>`;
        }).join('')}
        <tr class="total-row">
          <td>TOTAL GENERAL</td>
          ${months.map(mk=>`<td>${fmtCLP(sum(rows,r=>r.perMonth[months.indexOf(mk)]))}</td>`).join('')}
          <td>${fmtCLP(grandTotal)}</td><td>100.0%</td><td></td><td></td>
        </tr>
        </tbody>
      </table>
      </div>
    </div>
    <div class="panel">
      <h3>Participación por local</h3>
      <div class="chart-wrap"><canvas id="chartLocal"></canvas></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;

  if(charts.local) charts.local.destroy();
  charts.local = new Chart(document.getElementById('chartLocal'), {
    type:'bar',
    data:{
      labels: rows.map(r=>r.local),
      datasets:[{label:'Total', data: rows.map(r=>r.total), backgroundColor:'#8f6427'}]
    },
    options:{indexAxis:'y', plugins:{legend:{display:false}},
      scales:{x:{ticks:{callback:v=>'$'+(v/1e6).toFixed(0)+'M'}}}}
  });
}

/* =========================================================
   TAB: SEMANA VS FIN DE SEMANA
   ========================================================= */
function renderFinde(){
  const recs = getSelectedRecords();
  const locals = [...new Set(recs.map(r=>r.local))];

  const rows = locals.map(local=>{
    const own = recs.filter(r=>r.local===local);
    const finde = sum(own.filter(r=>r.tipoDia==='Fin de Semana'), r=>r.bruto);
    const semana = sum(own.filter(r=>r.tipoDia==='Semana'), r=>r.bruto);
    const total = finde+semana;
    return {local, finde, semana, total};
  }).sort((a,b)=>b.total-a.total);

  const grandTotal = sum(rows, r=>r.total);
  const grandFinde = sum(rows, r=>r.finde);

  let html = `
    <div class="panel">
      <h3>Ventas: días de semana vs fin de semana</h3>
      <table>
        <thead><tr><th>Local</th><th>Vtas Fin de Semana</th><th>Vtas Semana</th><th>Total</th><th>% Fin de Semana</th><th>% Semana</th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.local}</td>
          <td>${fmtCLP(r.finde)}</td>
          <td>${fmtCLP(r.semana)}</td>
          <td><strong>${fmtCLP(r.total)}</strong></td>
          <td>${fmtPct(r.finde/r.total)}</td>
          <td>${fmtPct(r.semana/r.total)}</td>
        </tr>`).join('')}
        <tr class="total-row">
          <td>TOTAL GENERAL</td>
          <td>${fmtCLP(grandFinde)}</td>
          <td>${fmtCLP(grandTotal-grandFinde)}</td>
          <td>${fmtCLP(grandTotal)}</td>
          <td>${fmtPct(grandFinde/grandTotal)}</td>
          <td>${fmtPct((grandTotal-grandFinde)/grandTotal)}</td>
        </tr>
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   TAB: TICKET PROMEDIO
   ========================================================= */
function renderTicket(){
  const recs = getSelectedRecords();
  const months = getSelectedMonths();
  const locals = [...new Set(recs.map(r=>r.local))];

  function ticketFor(local, mk){
    const rows = recs.filter(r=>r.local===local && r.monthKey===mk && !r.devolucion);
    const comprobantes = new Set(rows.map(r=>r.comprobante));
    const total = sum(rows, r=>r.bruto);
    return comprobantes.size ? total/comprobantes.size : 0;
  }

  const tableRows = locals.map(local=>{
    const perMonth = months.map(mk=>ticketFor(local,mk));
    const allRows = recs.filter(r=>r.local===local && !r.devolucion);
    const cantComprobantes = new Set(allRows.map(r=>r.comprobante)).size;
    const first = perMonth[0], last = perMonth[perMonth.length-1];
    const varPct = (first) ? (last-first)/first : null;
    return {local, cantComprobantes, perMonth, varPct};
  }).sort((a,b)=>b.cantComprobantes-a.cantComprobantes);

  let html = `
    <div class="panel">
      <h3>Ticket promedio por local y mes</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Local</th><th>Cant. comprobantes</th>
          ${months.map(mk=>`<th>${recs.find(r=>r.monthKey===mk).monthLabel}</th>`).join('')}
          <th>Var% (primer→último mes)</th>
        </tr></thead>
        <tbody>
        ${tableRows.map(r=>`<tr>
          <td>${r.local}</td>
          <td>${r.cantComprobantes.toLocaleString('es-CL')}</td>
          ${r.perMonth.map(v=>`<td>${fmtCLP(v)}</td>`).join('')}
          <td>${r.varPct===null?'s/d':fmtPct(r.varPct)}</td>
        </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   TAB: VENTAS POR DÍA
   ========================================================= */
function renderDia(){
  const recs = getSelectedRecords();
  const total = sum(recs, r=>r.bruto);

  const rows = WEEKDAYS.map(day=>{
    const own = recs.filter(r=>r.weekday===day);
    const ventas = sum(own, r=>r.bruto);
    const noDevol = own.filter(r=>!r.devolucion);
    const comprobantes = new Set(noDevol.map(r=>r.comprobante)).size;
    const ticket = comprobantes ? sum(noDevol,r=>r.bruto)/comprobantes : 0;
    return {day, ventas, ticket};
  });

  let html = `
    <div class="panel">
      <h3>Ventas totales por día de la semana (todos los locales)</h3>
      <table>
        <thead><tr><th>Día</th><th>Ventas totales</th><th>% sobre total</th><th>Ticket prom. por comprobante</th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.day}</td>
          <td>${fmtCLP(r.ventas)}</td>
          <td>${fmtPct(r.ventas/total)}</td>
          <td>${fmtCLP(r.ticket)}</td>
        </tr>`).join('')}
        <tr class="total-row"><td>TOTAL</td><td>${fmtCLP(total)}</td><td>100.0%</td><td></td></tr>
        </tbody>
      </table>
    </div>
    <div class="panel">
      <h3>Distribución semanal</h3>
      <div class="chart-wrap"><canvas id="chartDia"></canvas></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;

  if(charts.dia) charts.dia.destroy();
  charts.dia = new Chart(document.getElementById('chartDia'), {
    type:'bar',
    data:{labels: rows.map(r=>r.day), datasets:[{label:'Ventas', data: rows.map(r=>r.ventas), backgroundColor:'#b8863b'}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1e6).toFixed(0)+'M'}}}}
  });
}

/* =========================================================
   TAB: DEVOLUCIONES
   ========================================================= */
function renderDevoluciones(){
  const recs = getSelectedRecords();
  const locals = [...new Set(recs.map(r=>r.local))];

  const rows = locals.map(local=>{
    const own = recs.filter(r=>r.local===local);
    const ventasPositivas = sum(own.filter(r=>!r.devolucion), r=>r.bruto);
    const devolRows = own.filter(r=>r.devolucion);
    const devoluciones = sum(devolRows, r=>r.bruto);
    const cantidad = new Set(devolRows.map(r=>r.comprobante)).size;
    return {local, ventasPositivas, devoluciones, cantidad, pct: ventasPositivas ? Math.abs(devoluciones)/ventasPositivas : 0};
  }).sort((a,b)=>b.ventasPositivas-a.ventasPositivas);

  const totalVentas = sum(rows, r=>r.ventasPositivas);
  const totalDevol = sum(rows, r=>r.devoluciones);
  const totalCant = sum(rows, r=>r.cantidad);

  let html = `
    <div class="panel">
      <h3>Notas de crédito / anulaciones por local</h3>
      <table>
        <thead><tr><th>Local</th><th>Ventas Brutas Positivas</th><th>Devoluciones/Anulaciones</th><th>% Devolución s/Ventas</th><th>Cant. Notas de Crédito</th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.local}</td>
          <td>${fmtCLP(r.ventasPositivas)}</td>
          <td>${fmtCLP(r.devoluciones)}</td>
          <td>${fmtPct(r.pct)}</td>
          <td>${r.cantidad}</td>
        </tr>`).join('')}
        <tr class="total-row">
          <td>TOTAL GENERAL</td><td>${fmtCLP(totalVentas)}</td><td>${fmtCLP(totalDevol)}</td>
          <td>${fmtPct(Math.abs(totalDevol)/totalVentas)}</td><td>${totalCant}</td>
        </tr>
        </tbody>
      </table>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">
        Se considera devolución toda línea marcada como Nota de Crédito o con Venta Total Bruta negativa.
      </p>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   TAB: RANKING MENSUAL
   ========================================================= */
function renderRanking(){
  const recs = getSelectedRecords();
  const months = getSelectedMonths();
  const byLocalMonth = totalsByLocalMonth(recs);
  const locals = Object.keys(byLocalMonth);

  // rank de cada local por mes
  const ranksByMonth = {};
  months.forEach(mk=>{
    const sorted = locals
      .map(l => ({l, v: byLocalMonth[l][mk]||0}))
      .sort((a,b)=>b.v-a.v);
    sorted.forEach((r,i)=>{
      ranksByMonth[mk] = ranksByMonth[mk] || {};
      ranksByMonth[mk][r.l] = i+1;
    });
  });

  const rows = locals.map(local=>{
    const ranks = months.map(mk => ranksByMonth[mk][local] || null);
    const first = ranks[0], last = ranks[ranks.length-1];
    const cambio = (first && last) ? first-last : null;
    return {local, ranks, cambio};
  }).sort((a,b)=>(a.ranks[a.ranks.length-1]||99)-(b.ranks[b.ranks.length-1]||99));

  let html = `
    <div class="panel">
      <h3>Evolución del ranking de locales mes a mes</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Local</th>
          ${months.map(mk=>`<th>${recs.find(r=>r.monthKey===mk).monthLabel}</th>`).join('')}
          <th>Cambio (primer→último mes)</th>
        </tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.local}</td>
          ${r.ranks.map(v=>`<td>${v||'—'}</td>`).join('')}
          <td>${r.cambio===null?'s/d':(r.cambio>0?'+':'')+r.cambio}</td>
        </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">
        "Cambio" positivo = subió puestos en el ranking desde el primer al último mes seleccionado; negativo = bajó puestos.
      </p>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

/* =========================================================
   TAB: ACUMULADO (YTD)
   ========================================================= */
function renderAcumulado(){
  const recs = getSelectedRecords();
  const months = getSelectedMonths();
  const byLocalMonth = totalsByLocalMonth(recs);
  const locals = Object.keys(byLocalMonth).sort((a,b)=>{
    const totalA = sum(Object.values(byLocalMonth[a]),x=>x);
    const totalB = sum(Object.values(byLocalMonth[b]),x=>x);
    return totalB - totalA;
  });

  // acumulado general mes a mes
  let running = 0;
  const totalAcum = months.map(mk=>{
    const monthTotal = sum(recs.filter(r=>r.monthKey===mk), r=>r.bruto);
    running += monthTotal;
    return {mk, label: recs.find(r=>r.monthKey===mk).monthLabel, monthTotal, running};
  });

  // acumulado por local (matriz corrida)
  const runningByLocal = {};
  locals.forEach(l=> runningByLocal[l]=0 );
  const localRows = months.map(mk=>{
    const vals = {};
    locals.forEach(l=>{
      runningByLocal[l] += (byLocalMonth[l][mk]||0);
      vals[l] = runningByLocal[l];
    });
    return {mk, label: recs.find(r=>r.monthKey===mk).monthLabel, vals};
  });

  let html = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="label">Acumulado del período (YTD)</div>
        <div class="value">${fmtCLP(totalAcum.length ? totalAcum[totalAcum.length-1].running : 0)}</div>
      </div>
      <div class="kpi">
        <div class="label">Promedio mensual</div>
        <div class="value">${fmtCLP(totalAcum.length ? totalAcum[totalAcum.length-1].running/totalAcum.length : 0)}</div>
      </div>
    </div>

    <div class="panel">
      <h3>Ventas acumuladas mes a mes (todos los locales)</h3>
      <div class="chart-wrap"><canvas id="chartAcum"></canvas></div>
    </div>

    <div class="panel">
      <h3>Detalle acumulado</h3>
      <table>
        <thead><tr><th>Mes</th><th>Venta del mes</th><th>Acumulado (YTD)</th></tr></thead>
        <tbody>
        ${totalAcum.map(r=>`<tr><td>${r.label}</td><td>${fmtCLP(r.monthTotal)}</td><td><strong>${fmtCLP(r.running)}</strong></td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Acumulado por local</h3>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Mes</th>${locals.map(l=>`<th>${l}</th>`).join('')}</tr></thead>
        <tbody>
        ${localRows.map(r=>`<tr><td>${r.label}</td>${locals.map(l=>`<td>${fmtCLP(r.vals[l])}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;

  if(charts.acum) charts.acum.destroy();
  charts.acum = new Chart(document.getElementById('chartAcum'), {
    type:'line',
    data:{
      labels: totalAcum.map(r=>r.label),
      datasets:[{
        label:'Acumulado', data: totalAcum.map(r=>r.running),
        borderColor:'#3f7d5c', backgroundColor:'rgba(63,125,92,.15)',
        fill:true, tension:.2, pointRadius:4
      }]
    },
    options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1e6).toFixed(0)+'M'}}}}
  });
}

/* =========================================================
   EXPORTAR A EXCEL
   ========================================================= */
function tableToAOA(tableEl){
  const aoa = [];
  tableEl.querySelectorAll('tr').forEach(tr=>{
    const row = [];
    tr.querySelectorAll('th,td').forEach(cell=>{
      const txt = cell.textContent.trim();
      // intenta convertir montos "$1.234.567" o "12.3%" a número plano; si no, deja el texto
      const asNumber = txt.replace(/[$.\s]/g,'').replace(',','.');
      if(/^-?\d+(\.\d+)?%$/.test(txt)){
        row.push(parseFloat(txt.replace('%',''))/100);
      } else if(/^-?\$?\d[\d.,]*$/.test(txt) && txt.length>0){
        const n = parseFloat(txt.replace(/[$.]/g,'').replace(',','.'));
        row.push(isNaN(n)? txt : n);
      } else {
        row.push(txt);
      }
    });
    aoa.push(row);
  });
  return aoa;
}

function exportToExcel(){
  const wb = XLSX.utils.book_new();
  const tabsToExport = ['resumen','local','finde','ticket','dia','devoluciones','ranking','acumulado'];
  const currentTab = activeTab;

  tabsToExport.forEach(tab=>{
    activeTab = tab;
    renderActiveTab();
    const tables = document.querySelectorAll('#content table');
    tables.forEach((tableEl, idx)=>{
      const aoa = tableToAOA(tableEl);
      const sheetName = (TAB_TITLES[tab][0] + (tables.length>1 ? ' '+(idx+1) : '')).substring(0,31);
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
  });

  // hoja de datos crudos filtrados por el período seleccionado
  const recs = getSelectedRecords();
  const datosAOA = [['Fecha','Mes','Día','TipoDia','Local','Total Bruto','EsDevolucion']];
  recs.forEach(r=>{
    datosAOA.push([
      r.fecha.toLocaleDateString('es-CL'), r.monthLabel, r.weekday, r.tipoDia, r.local, r.bruto, r.devolucion ? 'TRUE':'FALSE'
    ]);
  });
  const wsDatos = XLSX.utils.aoa_to_sheet(datosAOA);
  XLSX.utils.book_append_sheet(wb, wsDatos, 'Datos');

  activeTab = currentTab;
  renderActiveTab();

  const from = document.getElementById('fromMonth').value;
  const to = document.getElementById('toMonth').value;
  XLSX.writeFile(wb, `Informe_Ventas_Locales_${from}_a_${to}.xlsx`);
}

document.getElementById('exportBtn').addEventListener('click', exportToExcel);
